<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <main>
        <div class="left">
          <img src="" alt="" class="myImages" />

          <span class="images">
            <button class="next">></button>
          </span>
        </div>

        <div class="right">
          <span class="data">
            <h1 class="productName">Casual T-Shirts</h1>
            <p class="price">$ 200.00</p>
            <p class="discount">Discount 17.88%</p>
            <p class="decrib">
              Lorem ipsum dolor sit amet consectetur adipisicing elit. Omnis
              recusandae nesciunt quis itaque totam animi, vel labore amet
              officia fugiat sed facilis, enim aperiam ex quasi ad delectus,
              eveniet at.
            </p>
            <span class="sizesContainer">
              <p class="sizes">Sizes</p>
              <button>S</button>
              <button>M</button>
              <button>L</button>
              <button>XL</button>
              <button>XXL</button>
            </span>

            <!-- <div class="colorContainer">
                        <p>Color</p>
                        <input type="color">
                        </div> -->

            <p class="quantity">
              Quantity: <span class="quantityPrice"></span>
            </p>
            <button class="buy">Buy Now</button>
            <div class="notification"></div>
          </span>
        </div>
      </main>
    </header>

    <script src="script.js"></script>
  </body>
</html>
