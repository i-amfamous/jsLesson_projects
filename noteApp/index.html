<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoteApp</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
    <!-- Modal -->
  <div class="modal-overlay" id="taskModal">
    <div class="modal">

        <form id="taskForm">
            <input
                type="text"
                id="taskTitle"
                placeholder="Task name"
                required
            >

            <textarea
                id="taskDescription"
                placeholder="Description"
            ></textarea>

            <input type="date" id="taskDate">

            <input type="time" id="taskTime">

            <div class="modal-buttons">
                <button type="button" id="closeModal">
                    Cancel
                </button>

                <button type="submit" id="submitBtn">
                    Add task
                </button>
            </div>
        </form>

    </div>
</div>


      <div class="sidebar">
        <div class="user">
          <span class="profile">
            <img src="img/account-circle-fill.svg" alt="User Profile Picture" />
            <h2>User Name</h2>
          </span>

          <span class="user-actions">
            <img src="img/notification-3-line.svg" alt="">
            <img src="img/layout-column-line.svg" alt="">
          </span>
        </div>

        <div class="action">
            <span class="addNote">
                <button class="addNote"><img src="img/add-line.svg" alt="Add Note" />Add task</button>
                <button><img src="img/search-line.svg" alt="Add Note" />Search task</button>
                <button><img src="img/calendar-event-svgrepo-com.svg" height="30" alt="Add Note" />Today</button>
                <button><img src="img/calendar-fill.svg" alt="Add Note" />Upcoming</button>
                <button><img src="img/equalizer-2-line.svg" alt="Add Note" />Filter & Labels</button>
            </span>
        </div>

        <div class="projects">
             <div class="profile">
                <img src="img/account-circle-fill.svg" alt="User Profile Picture" />
                <h2>User Projects</h2>
             </div>


            <div class="projectCards">
                <!-- <p><span class="hash">#</span> Project1</p> -->
            </div>

      </div>
    </div>
    <div class="mainContent">
      <div class="head">
          <h1 class="day">Today</h1>
          <span class="mainRight">
            <img src="img/equalizer-2-line.svg" alt="Add Note" />
          <button class="view">View</button>
          </span>
      </div>

      <div class="noteCard">
          <h1 class="notHead">My Projects</h1>
          <!-- <div class="messageInfo">
             <span>
                 <input class="checkbox" type="checkbox" placeholder="Add a task..." />
              <p class="message">Hello this is my first project</p>
             </span>
              <p class="time">7:00 AM</p>
              <button class="edit">Edit</button>
          </div> -->
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
